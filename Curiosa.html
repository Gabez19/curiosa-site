<style>
/* Layout: uma única coluna de leitura. O tema sorteado ocupa o palco e a navegação fica discreta em volta. */
:root{
  --bg:#EFF2EE;
  --surface:#F8FAF7;
  --ink:#15201B;
  --muted:#5B685F;
  --line:#D5DBD3;
  --line-strong:#B3BEB5;
  --accent:#0E6F5F;
  --on-accent:#FFFFFF;
  --accent-soft:#DCEBE5;
  --danger:#A6361F;
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#141D19; --ink:#E7EEE9; --muted:#95A39A; --line:#25322B; --line-strong:#3B4B42;
    --accent:#58D0B4; --on-accent:#06231C; --accent-soft:#17302A; --danger:#F08A73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#141D19; --ink:#E7EEE9; --muted:#95A39A; --line:#25322B; --line-strong:#3B4B42;
  --accent:#58D0B4; --on-accent:#06231C; --accent-soft:#17302A; --danger:#F08A73; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 1rem/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:1040px;margin:0 auto;padding-block:16px 72px}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

/* Cabeçalho */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 24px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.brand{font:700 1.6rem/1 var(--f-display);letter-spacing:-.03em;color:var(--ink);text-decoration:none;padding-block:10px}
.brand i{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:var(--accent);margin-left:.1em}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-7px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.brand{order:1}
.nav{order:2}
.snd{order:3;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.snd:hover{background:var(--accent-soft);color:var(--ink)}
.snd[aria-pressed="true"]{color:var(--accent)}
@media (max-width:720px){.snd{order:2;margin-left:auto}.nav{order:3;flex-basis:100%}}

/* Botões e controles */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{
  font:600 .95rem/1.2 var(--f-body);padding:11px 18px;min-height:44px;border-radius:6px;
  border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.1)}
.btn.big{padding:15px 26px;font-size:1.05rem;min-height:52px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled,.seg button:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:transparent}
.btn svg{flex:none}
.linkbtn{
  background:none;border:0;border-bottom:1px dashed var(--line-strong);padding:6px 0;color:var(--muted);
  font:500 .95rem var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center;
}
.linkbtn:hover{color:var(--ink)}
.linkbtn svg{transition:transform .2s}
.linkbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{
  font:600 .9rem var(--f-body);padding:9px 14px;min-height:40px;background:transparent;color:var(--muted);
  border:0;border-right:1px solid var(--line-strong);cursor:pointer;
}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]:hover:not(:disabled){background:var(--ink);color:var(--bg)}
input,textarea,select{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);
  border-radius:6px;padding:10px 12px;width:100%;min-width:0;
}
textarea{resize:vertical;min-height:84px;line-height:1.5}
select{width:auto;max-width:100%}
input[type="checkbox"]{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
label,.lbl{font-weight:600;font-size:.92rem}
.field{display:grid;gap:6px;min-width:0}
.form{display:grid;gap:18px;max-width:720px}

/* Palco: sorteio e tema */
.stage{display:flex;flex-direction:column;align-items:flex-start;gap:26px;padding-top:clamp(28px,8vh,84px)}
.tagline{margin:0;font:600 clamp(1.8rem,5.4vw,3.2rem)/1.08 var(--f-display);letter-spacing:-.03em;text-wrap:balance}
.tagline span{display:block}
.tagline span:not(:first-child){color:var(--muted)}
.eyebrow{font:600 .78rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.topic{
  margin:0;max-width:100%;font:700 clamp(2.2rem,8.6vw,6.5rem)/.98 var(--f-display);
  letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;
}
.topic.long{font-size:clamp(1.9rem,6vw,4.2rem);line-height:1.04}
.topic.sm{font-size:clamp(1.6rem,4.6vw,2.7rem);line-height:1.06;letter-spacing:-.03em}
.topic.enter{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cats{display:grid;gap:0;justify-items:start;max-width:100%}
.catpanel{margin-top:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(760px,100%)}
.catgrid{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:0 18px}
.catgrid li{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.catgrid label{display:flex;align-items:center;gap:9px;padding:7px 0;min-width:0;cursor:pointer;font-weight:500}
.catgrid label small{color:var(--muted);font-variant-numeric:tabular-nums}
.only{background:none;border:0;color:var(--accent);font:600 .82rem var(--f-body);cursor:pointer;padding:6px 4px}
.warn{color:var(--danger);margin:12px 0 0;font-size:.92rem}

/* Etapas do desafio */
.work{display:grid;gap:20px;justify-items:start;padding-top:clamp(16px,4vh,40px)}
.work>*{max-width:100%}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0;font-size:.88rem;font-weight:600;color:var(--muted)}
.stepper li{display:flex;align-items:center}
.stepper li:not(:last-child)::after{content:"";width:28px;height:1px;background:var(--line-strong);margin-inline:10px}
.stepper .is-done{color:var(--ink)}
.stepper .is-cur{color:var(--accent)}
.stepper .is-cur::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px}
.timer{display:grid;gap:14px;justify-items:start;width:min(640px,100%)}
.clock{font:600 clamp(4rem,17vw,9rem)/1 var(--f-num);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.bar{height:3px;width:100%;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .25s linear}
.lead{max-width:56ch;margin:0}
.apoio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;width:100%;max-width:880px}
.q{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;max-width:720px}
.q span{flex:1 1 260px;font-weight:500}

.page{padding-top:clamp(20px,5vh,48px)}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.pagehead h1,.page h1.title{margin:0;font:700 clamp(1.8rem,5vw,2.8rem)/1.05 var(--f-display);letter-spacing:-.03em}
.page h2{font:700 1.3rem/1.2 var(--f-display);letter-spacing:-.02em;margin:0 0 10px}
.page h3{font:600 .8rem/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.inline{display:flex;align-items:center;gap:10px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows>li{border-bottom:1px solid var(--line)}
.rowhead{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;padding:18px 0;cursor:pointer;color:inherit;font:inherit}
.r-title{font:600 1.35rem/1.2 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.r-meta{color:var(--muted);font-size:.9rem}
.rowhead:hover .r-title{color:var(--accent)}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.item .r-title{display:block}
.detail{display:grid;gap:18px;padding:2px 0 24px;max-width:760px}
.qa{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:6px 0;border-bottom:1px dotted var(--line-strong)}
.qa dt,.qa dd{margin:0}
.qa dd{font-weight:600}
dl{margin:0}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.note{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.note h2{margin:0;font-size:1.2rem}
.note .links{display:grid;gap:2px;font-size:.9rem;overflow-wrap:anywhere}
.empty{color:var(--muted);max-width:52ch;padding:18px 0}
.block{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;padding:8px 0;min-width:0;flex:1}
.chk .done{text-decoration:line-through;color:var(--muted)}
.chk span{overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 10px;line-height:1}
.x:hover{color:var(--danger)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 220px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function pool(){const ex=new Set(S.prefs.excl); return TOPICOS.filter(t=>!ex.has(t.cid));}
function draw(){
  const p=pool(); if(!p.length) return null;
  const n=Math.min(60,Math.floor(p.length/2));
  const rec=new Set(S.recent.slice(-n));
  let c=p.filter(t=>!rec.has(t.id));
  if(!c.length) c=p;
  const cur=S.ch&&S.ch.topic&&S.ch.topic.id;
  const sem=c.filter(t=>t.id!==cur);
  if(sem.length) c=sem;
  return c[Math.floor(Math.random()*c.length)];
}

   ============================================================ */
const curTimer=()=>!S.ch?null:S.ch.stage==='pesquisa'?S.ch.pesq:S.ch.stage==='explicacao'?S.ch.expl:null;
const elapsed=t=>t.acc+(t.status==='running'?Date.now()-t.t0:0);
const remaining=t=>Math.max(0,t.dur*1000-elapsed(t));

function finishTimer(){
  const t=curTimer(); if(!t) return;
  Snd.cancelAll();
  if(t.status!=='done'){
    const e=Math.min(t.dur*1000,elapsed(t));
    t.acc=e; t.spent=Math.round(e/1000); t.status='done'; t.t0=0;
  }
  if(S.ch.stage==='pesquisa'){S.ch.stage='explicacao'; S.ch.expl.dur=S.prefs.expl*60;}
  else S.ch.stage='reflexao';
  save('ch'); ui.top=true; ui.anim=true;
}

/* ============================================================
   Efeitos sonoros (Web Audio API, sem arquivos de áudio)
   - O contexto de áudio só é criado e liberado após um gesto do usuário.
   - A contagem final é agendada no relógio do próprio áudio quando o
     cronômetro inicia ou continua. Assim os sons saem na hora certa mesmo
     com a aba em segundo plano, e são cancelados ao pausar, reiniciar,
     finalizar ou silenciar.
   ============================================================ */
const Snd={
  ctx:null,master:null,fx:new Set(),cd:new Set(),endScheduled:false,
  on(){return S.prefs.som!==false;},
  ensure(){
    if(!this.on()) return null;
    if(!this.ctx){
      try{
        const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
        this.ctx=new C(); this.master=this.ctx.createGain(); this.master.gain.value=.8; this.master.connect(this.ctx.destination);
        this.ctx.onstatechange=()=>{syncCountdown();};
      }catch(e){this.ctx=null; return null;}
    }
    return this.ctx;
  },
  unlock(){
    const c=this.ensure(); if(!c) return;
    if(c.state!=='running'){try{c.resume().then(()=>syncCountdown()).catch(()=>{});}catch(e){}}
  },
  ready(){return !!(this.on()&&this.ctx&&this.ctx.state==='running');},
  group(kind){
    const g=this.ctx.createGain(); g.gain.value=1; g.connect(this.master);
    const grp={g:g,nodes:[],end:0};
    (kind==='cd'?this.cd:this.fx).add(grp);
    return grp;
  },
  tone(grp,o){
    const c=this.ctx,t=c.currentTime+(o.at||0),d=o.dur;
    const osc=c.createOscillator(),v=c.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f,t);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+d);
    v.gain.setValueAtTime(.0001,t);
    v.gain.exponentialRampToValueAtTime(o.vol,t+(o.att||.006));
    v.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(v); v.connect(grp.g); osc.start(t); osc.stop(t+d+.03);
    grp.nodes.push(osc); grp.end=Math.max(grp.end,(o.at||0)+d+.05);
  },
  retire(grp,set){
    setTimeout(()=>{set.delete(grp); try{grp.g.disconnect();}catch(e){}},Math.max(300,(grp.end+.4)*1000));
  },
  kill(grp,set,fade){
    const c=this.ctx; set.delete(grp); if(!c) return;
    const t=c.currentTime,f=fade||.02;
    try{grp.g.gain.cancelScheduledValues(t); grp.g.gain.setValueAtTime(grp.g.gain.value,t); grp.g.gain.linearRampToValueAtTime(0,t+f);}catch(e){}
    grp.nodes.forEach(n=>{try{n.stop(t+f+.01);}catch(e){}});
    setTimeout(()=>{try{grp.g.disconnect();}catch(e){}},400);
  },
  cutFx(){Array.from(this.fx).forEach(g=>this.kill(g,this.fx,.02));},
  cancelCd(){Array.from(this.cd).forEach(g=>this.kill(g,this.cd,.03)); this.endScheduled=false;},
  cancelAll(){this.cutFx(); this.cancelCd(); cdSig='';},
  /* efeito imediato; late=true tenta de novo quando o áudio terminar de liberar */
  fxPlay(build,late){
    if(!this.on()) return;
    const c=this.ensure(); if(!c) return;
    const go=()=>{const grp=this.group('fx'); build(grp,0); this.retire(grp,this.fx);};
    if(c.state==='running') go();
    else if(late){try{c.resume().then(()=>{if(c.state==='running'&&this.on()) go();}).catch(()=>{});}catch(e){}}
  },
  /* construtores de som */
  bTick(g,at,k){this.tone(g,{f:k%2?1180:1420,f2:k%2?620:760,dur:.035,vol:.09,type:'triangle',att:.002,at:at});},
  bReveal(g,at){
    this.tone(g,{f:784,dur:.5,vol:.11,at:at});
    this.tone(g,{f:1175,dur:.6,vol:.09,at:at+.09});
  },
  bStart(g,at){
    this.tone(g,{f:587,dur:.1,vol:.1,at:at});
    this.tone(g,{f:880,dur:.18,vol:.1,at:at+.09});
  },
  bPop(g,at,f){this.tone(g,{f:f,f2:f*.42,dur:.07,vol:.14,type:'triangle',att:.002,at:at});},
  bNum(g,at,n){
    const F={5:440,4:494,3:554,2:659,1:784};
    this.tone(g,{f:F[n],dur:n===1?.2:.13,vol:.12,at:at});
  },
  bEnd(g,at){
    [523,659,784,1047].forEach((f,i)=>this.tone(g,{f:f,dur:i===3?.9:.4,vol:.11,at:at+i*.13}));
  },
  tick(k){this.fxPlay((g,at)=>this.bTick(g,at,k),false);},
  reveal(){this.cutFx(); this.fxPlay((g,at)=>this.bReveal(g,at),true);},
  start(){this.cutFx(); this.fxPlay((g,at)=>this.bStart(g,at),true);},
  confirm(){this.cutFx(); this.fxPlay((g,at)=>this.bPop(g,at,900),true);},
  endNow(){this.fxPlay((g,at)=>this.bEnd(g,at),false);},
  /* agenda a contagem final para o tempo restante informado (ms) */
  scheduleCd(rem){
    if(!this.ready()) return;
    const grp=this.group('cd');
    const ev=[[15000,'p',700],[10000,'p',900],[5000,'n',5],[4000,'n',4],[3000,'n',3],[2000,'n',2],[1000,'n',1],[0,'e']];
    ev.forEach(e=>{
      if(rem<=e[0]) return;
      const at=(rem-e[0])/1000;
      if(e[1]==='p') this.bPop(grp,at,e[2]);
      else if(e[1]==='n') this.bNum(grp,at,e[2]);
      else {this.bEnd(grp,at); this.endScheduled=true;}
    });
    this.retire(grp,this.cd);
  }
};

let cdSig='';
function syncCountdown(force){
  const t=curTimer();
  if(t&&t.status==='done') return;   /* fim natural: deixa o som de encerramento terminar */
  const run=!!(t&&t.status==='running');
  const sig=run?[S.ch.stage,t.t0,t.acc,t.dur].join('|'):'-';
  const full=sig+'|'+(Snd.ready()?1:0);
  if(full===cdSig&&!force) return;
  cdSig=full;
  Snd.cancelCd();
  if(!run) return;
  Snd.scheduleCd(remaining(t));
}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>Snd.unlock(),{passive:true,capture:true}));

let wl=null;
async function wake(on){
  try{
    if(on){
      if(!wl&&navigator.wakeLock){
        wl=await navigator.wakeLock.request('screen');
        wl.addEventListener('release',()=>{wl=null;});
      }
    }else if(wl){const w=wl; wl=null; await w.release();}
  }catch(e){wl=null;}
}
function syncWake(){const t=curTimer(); wake(!!(t&&t.status==='running'&&document.visibilityState==='visible'));}

function tick(){
  const t=curTimer();
  if(!t){if(document.title!=='Curiosa') document.title='Curiosa'; return;}
  if(t.status==='running'&&remaining(t)<=0){
    t.acc=t.dur*1000; t.spent=t.dur; t.status='done'; t.t0=0;
    save('ch'); if(Snd.ready()&&!Snd.endScheduled) Snd.endNow(); render(); return;
  }
  const rem=remaining(t);
  const clk=$('#clock'); if(clk) clk.textContent=fmtClock(rem);
  const bar=$('#barfill'); if(bar) bar.style.transform='scaleX('+Math.min(1,t.dur?elapsed(t)/(t.dur*1000):0)+')';
  const title=t.status==='running'?fmtClock(rem)+' · Curiosa':t.status==='done'?'Tempo encerrado · Curiosa':'Curiosa';
  if(document.title!==title) document.title=title;
}

/* --- início --- */
function stepper(cur){
  const s=[['pesquisa','Pesquisa'],['explicacao','Explicação'],['reflexao','Reflexão']];
  const idx=s.findIndex(x=>x[0]===cur);
  return '<ol class="stepper" aria-label="Etapas do desafio">'+s.map((x,i)=>'<li class="'+(i<idx?'is-done':i===idx?'is-cur':'')+'"'+(i===idx?' aria-current="step"':'')+'>'+x[1]+'</li>').join('')+'</ol>';
}
function topicHead(t,cls){
  return '<div class="eyebrow">'+esc(t.c)+'</div><h1 id="topicText" class="topic '+(cls||'')+'">'+esc(t.t)+'</h1>';
}
function vInicio(){
  if(ui.done) return vDone();
  const c=S.ch;
  if(!c) return vIdle();
  if(c.stage==='sorteado') return vSorteado();
  if(c.stage==='pesquisa') return vPesquisa();
  if(c.stage==='explicacao') return vExplicacao();
  if(c.stage==='reflexao') return vReflexao();
  return vIdle();
}
function vIdle(){
  const mp=S.prefs.pesq,me=S.prefs.expl;
  return '<section class="stage"><h1 class="tagline"><span>Um tema ao acaso.</span><span>'+mp+' minutos para pesquisar.</span><span>'+me+' '+(me===1?'minuto':'minutos')+' para explicar.</span></h1>'+
    '<div class="row"><button class="btn primary big" data-act="sortear"'+(pool().length?'':' disabled')+'>Sortear tema</button></div>'+
    catBar()+'<p class="small muted">'+TOPICOS.length+' temas em '+BANCO.length+' categorias.</p></section>';
}
function vSorteado(){
  const t=S.ch.topic,sv=isSaved(t.id);
  return '<section class="stage">'+
    '<div class="eyebrow">'+esc(t.c)+'</div>'+
    '<h1 id="topicText" class="topic'+(t.t.length>26?' long':'')+(ui.anim&&!ui.shuffle?' enter':'')+'">'+esc(t.t)+'</h1>'+
    '<p class="sr-only" role="status">Tema sorteado: '+esc(t.t)+'. Categoria: '+esc(t.c)+'.</p>'+
    '<div class="row"><button class="btn primary big" data-act="iniciarPesq">Começar a pesquisar</button>'+
    '<button class="btn" data-act="sortear"'+(pool().length?'':' disabled')+'>Sortear outro</button>'+
    '<button class="btn" data-act="salvar" aria-pressed="'+sv+'">'+ICON.bm(sv)+(sv?'Tema salvo':'Salvar tema')+'</button></div>'+
    catBar()+'</section>';
}
function timerBlock(t,opts){
  const st=t.status,started=t.acc>0||st==='running'||st==='done';
  const idle=st==='idle'&&t.acc===0;
  const pct=Math.min(1,t.dur?elapsed(t)/(t.dur*1000):0);
  const msg=st==='running'?'Em andamento. Pode trocar de aba ou de janela: o tempo continua contando.':st==='paused'?'Pausado.':st==='done'?'Tempo encerrado.':'Pronto quando você estiver.';
  const next=S.ch.stage==='pesquisa'?'Ir para a explicação':'Ir para a reflexão';
  let main='';
  if(st==='idle'||st==='paused') main='<button class="btn primary big" data-act="tstart">'+(st==='paused'?'Continuar':'Iniciar')+'</button>';
  else if(st==='running') main='<button class="btn primary big" data-act="tpause">Pausar</button>';
  return '<div class="timer"><div class="seg" role="group" aria-label="Duração">'+
    opts.map(m=>'<button data-act="dur" data-v="'+m+'" aria-pressed="'+(t.dur===m*60)+'"'+(started?' disabled':'')+'>'+m+' min</button>').join('')+'</div>'+
    '<div id="clock" class="clock" role="timer">'+fmtClock(remaining(t))+'</div>'+
    '<div class="bar" aria-hidden="true"><i id="barfill" style="transform:scaleX('+pct+')"></i></div>'+
    '<p class="small muted" style="margin:0">'+msg+'</p>'+
    '<div class="row">'+main+
    '<button class="btn" data-act="trestart"'+(idle?' disabled':'')+'>Reiniciar</button>'+
    '<button class="btn'+(st==='done'?' primary big':'')+'" data-act="tfinish"'+(idle?' disabled':'')+'>'+(st==='done'?next:'Finalizar')+'</button></div></div>';
}

function topicChoices(){
  const m=new Map();

  if(ui.noteDraft) add(ui.noteDraft.topic);
  if(S.ch) add(S.ch.topic);
  S.saved.forEach(add);
  S.history.slice(0,40).forEach(h=>add(h.topic));
  return Array.from(m.values());
}

const FORMATO=1;
let DL=null;
try{if(window.claude&&window.claude.use) window.claude.use('downloads').then(d=>{DL=d||null;}).catch(()=>{});}catch(e){}
const catNome=id=>{const c=BANCO.find(x=>x.id===id); return c?c.nome:'';};

function buildExport(){
  const p=S.prefs;
  return {app:'curiosa',formato:FORMATO,exportadoEm:new Date().toISOString(),
    dados:{
      preferencias:{pesq:p.pesq,expl:p.expl,excl:p.excl,som:p.som!==false,tema:p.tema},
      historico:S.history,salvos:S.saved,anotacoes:S.notes,
      temasPersonalizados:S.custom,planos24h:S.plans
    }};
}
async function doExport(){
  const txt=JSON.stringify(buildExport(),null,2);
  const nome='curiosa-'+new Date().toISOString().slice(0,10)+'.json';
  ui.expText=''; ui.expMsg=null;
  if(DL){
    try{
      await DL.save({filename:nome,data:txt});
      ui.expMsg={ok:true,t:'Exportação concluída: '+nome+'.'};
      render(); return;
    }catch(e){
      if(e&&e.code==='declined'){ui.expMsg={ok:false,t:'Salvamento cancelado. Nada foi exportado.'}; render(); return;}
    }
  }
  ui.expText=txt;
  ui.expMsg={ok:true,t:'Não foi possível baixar o arquivo neste ambiente. Copie o texto abaixo e guarde em um arquivo .json.'};
  render();
}

/* Validação e limpeza do arquivo importado. Nada é gravado aqui. */
function parseImport(text){
  let j;
  try{j=JSON.parse(text);}catch(e){return {ok:false,erro:'O conteúdo não é um JSON válido.'};}
  if(!j||typeof j!=='object'||Array.isArray(j)||j.app!=='curiosa'||!j.dados||typeof j.dados!=='object')
    return {ok:false,erro:'Este arquivo não parece ser uma exportação do Curiosa.'};
  if(typeof j.formato!=='number'||j.formato<1) return {ok:false,erro:'O formato do arquivo está ausente ou inválido.'};
  if(j.formato>FORMATO) return {ok:false,erro:'O arquivo foi criado por uma versão mais nova do Curiosa (formato '+j.formato+'). Este aplicativo lê até o formato '+FORMATO+'.'};
  const d=j.dados,skip={n:0};
  const str=(v,max)=>typeof v==='string'?v.slice(0,max||20000):'';
  const num=(v,def)=>(typeof v==='number'&&isFinite(v))?v:def;
  const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const topic=t=>(obj(t)&&typeof t.id==='string'&&t.id&&typeof t.t==='string'&&t.t.trim()&&typeof t.c==='string'&&typeof t.cid==='string')?{id:t.id.slice(0,80),t:t.t.slice(0,120),c:t.c.slice(0,80),cid:t.cid.slice(0,60)}:null;
  const lista=(k,fn)=>{
    if(d[k]==null) return [];
    if(!Array.isArray(d[k])) throw new Error('A seção “'+k+'” está em formato inválido.');
    const out=[],ids=new Set();
    d[k].forEach(x=>{const y=fn(x); if(y&&!ids.has(y.id)){ids.add(y.id); out.push(y);} else skip.n++;});
    return out;
  };
  try{
    const now=Date.now();
    const history=lista('historico',h=>{
      if(!obj(h)||typeof h.id!=='string'||!h.id||typeof h.ts!=='number'||!isFinite(h.ts)) return null;
      const tp=topic(h.topic); if(!tp) return null;
      const refl={}; QF.forEach(q=>{const v=obj(h.refl)?h.refl[q[0]]:null; if(ANS[v]) refl[q[0]]=v;});
      if(obj(h.refl)&&typeof h.refl.confuso==='string') refl.confuso=str(h.refl.confuso);
      const apoio={}; APOIO.forEach(a=>{if(obj(h.apoio)&&typeof h.apoio[a[0]]==='string') apoio[a[0]]=str(h.apoio[a[0]]);});
      return {id:h.id.slice(0,80),ts:h.ts,topic:tp,pesquisaSeg:num(h.pesquisaSeg,0),explicacaoSeg:num(h.explicacaoSeg,0),
        pesquisaPlan:num(h.pesquisaPlan,0),explicacaoPlan:num(h.explicacaoPlan,0),apoio:apoio,refl:refl,aprendi:str(h.aprendi),quero:str(h.quero)};
    });
    const saved=lista('salvos',x=>{const tp=topic(x); return tp?Object.assign(tp,{ts:num(x.ts,now)}):null;});
    const notes=lista('anotacoes',n=>{
      if(!obj(n)||typeof n.id!=='string'||!n.id) return null;
      const tp=n.topic==null?null:topic(n.topic);
      if(n.topic!=null&&!tp) return null;
      return {id:n.id.slice(0,80),tipo:TIPOS[n.tipo]?n.tipo:'anotacao',titulo:str(n.titulo,300),corpo:str(n.corpo),links:str(n.links,5000),
        topic:tp,criada:num(n.criada,now),atualizada:num(n.atualizada,num(n.criada,now))};
    });
    const custom=lista('temasPersonalizados',c=>{
      if(!obj(c)||typeof c.id!=='string'||c.id.indexOf('u-')!==0||typeof c.t!=='string'||!c.t.trim()||c.t.length>120||!BANCO.some(x=>x.id===c.cid)) return null;
      return {id:c.id.slice(0,80),t:c.t.trim(),cid:c.cid,ts:num(c.ts,now)};
    });
    const plans=lista('planos24h',p=>{
      if(!obj(p)||typeof p.id!=='string'||!p.id) return null;
      const tp=topic(p.topic); if(!tp) return null;
      const et=Array.isArray(p.etapas)?p.etapas.filter(e=>obj(e)&&typeof e.id==='string'&&typeof e.txt==='string').map(e=>({id:e.id.slice(0,80),txt:e.txt.slice(0,500),ok:!!e.ok})):[];
      return {id:p.id.slice(0,80),criado:num(p.criado,now),topic:tp,objetivo:str(p.objetivo),sabia:str(p.sabia),etapas:et,
        descobertas:str(p.descobertas),duvidas:str(p.duvidas),reflexao:str(p.reflexao)};
    });
    const prefs={},pp=obj(d.preferencias)?d.preferencias:{};
    if([5,10,15,20].indexOf(pp.pesq)>=0) prefs.pesq=pp.pesq;
    if([1,2,3].indexOf(pp.expl)>=0) prefs.expl=pp.expl;
    if(Array.isArray(pp.excl)) prefs.excl=pp.excl.filter(id=>BANCO.some(c=>c.id===id));
    if(typeof pp.som==='boolean') prefs.som=pp.som;
    if(['auto','claro','escuro'].indexOf(pp.tema)>=0) prefs.tema=pp.tema;
    return {ok:true,data:{prefs:prefs,history:history,saved:saved,notes:notes,custom:custom,plans:plans},skipped:skip.n,
      exportadoEm:typeof j.exportadoEm==='string'?j.exportadoEm:''};
  }catch(e){return {ok:false,erro:e.message||'Não foi possível ler o arquivo.'};}
}
function impPreview(){
  const D=ui.imp.data,ids=a=>new Set(a.map(x=>x.id));
  const novos=(cur,inc)=>{const s2=ids(cur); return inc.filter(x=>!s2.has(x.id)).length;};
  const names=new Set(TOPICOS.map(t=>normTxt(t.t))),cid=ids(S.custom);
  const nc=D.custom.filter(c=>!cid.has(c.id)&&!names.has(normTxt(c.t))).length;
  return {novos:{h:novos(S.history,D.history),s:novos(S.saved,D.saved),n:novos(S.notes,D.notes),c:nc,p:novos(S.plans,D.plans)}};
}
function applyImport(mode){
  const I=ui.imp; if(!I||!I.ok) return;
  const D=I.data,pv=impPreview().novos;
  if(mode==='replace'){
    S.history=D.history.slice(); S.saved=D.saved.slice(); S.notes=D.notes.slice(); S.custom=D.custom.slice(); S.plans=D.plans.slice();
    Object.assign(S.prefs,D.prefs);
    S.prefs.excl=arr(S.prefs.excl);
  }else{
    const add=(cur,inc)=>{const s2=new Set(cur.map(x=>x.id)); return cur.concat(inc.filter(x=>!s2.has(x.id)));};
    S.history=add(S.history,D.history); S.saved=add(S.saved,D.saved); S.notes=add(S.notes,D.notes); S.plans=add(S.plans,D.plans);
    const names=new Set(TOPICOS.map(t=>normTxt(t.t))),ids=new Set(S.custom.map(x=>x.id));
    D.custom.forEach(c=>{if(ids.has(c.id)||names.has(normTxt(c.t))) return; S.custom.push(c); names.add(normTxt(c.t));});
  }
  S.history.sort((a,b)=>b.ts-a.ts); S.saved.sort((a,b)=>(b.ts||0)-(a.ts||0));
  S.notes.sort((a,b)=>(b.atualizada||0)-(a.atualizada||0)); S.plans.sort((a,b)=>b.criado-a.criado);
  ['history','saved','notes','plans','custom','prefs'].forEach(k=>save(k));
  rebuildTopics(); applyTheme();
  if(!S.prefs.som) Snd.cancelAll();
  ui.impMsg={ok:true,t:mode==='replace'
    ?'Importação concluída. Os dados anteriores foram substituídos pelos do arquivo.'
    :'Importação concluída: '+pv.h+' desafios, '+pv.s+' temas salvos, '+pv.n+' anotações, '+pv.c+' temas personalizados e '+pv.p+' planos novos. O que você já tinha foi mantido.'};
  ui.imp=null; ui.impText='';
}
function readImportText(txt,nome){
  ui.impMsg=null;
  ui.imp=Object.assign({nome:nome||'texto colado'},parseImport(txt));
}

function ctSave(){
  const d=ui.ctDraft; if(!d) return;
  const nome=(d.t||'').trim().replace(/\s+/g,' ');
  ui.ctErr='';
  if(!nome){ui.ctErr='Escreva o nome do tema.'; ui.focusId='ct-nome'; return;}
  if(nome.length>80){ui.ctErr='Use até 80 caracteres no nome.'; ui.focusId='ct-nome'; return;}
  if(!BANCO.some(c=>c.id===d.cid)){ui.ctErr='Escolha uma categoria.'; return;}
  const dup=TOPICOS.find(t=>normTxt(t.t)===normTxt(nome)&&t.id!==d.id);
  if(dup){ui.ctErr='Já existe um tema chamado “'+dup.t+'” em '+dup.c+'.'; ui.focusId='ct-nome'; return;}
  if(d.id){
    const it=S.custom.find(x=>x.id===d.id);
    if(it){it.t=nome; it.cid=d.cid;}
    S.saved.forEach(x=>{if(x.id===d.id){x.t=nome; x.cid=d.cid; x.c=catNome(d.cid);}});
    save('saved');
  }else S.custom.push({id:'u-'+uid(),t:nome,cid:d.cid,ts:Date.now()});
  save('custom'); rebuildTopics(); ui.ctDraft=null; ui.ctErr='';
}

/* ============================================================
   Renderização
   ============================================================ */
let flickTok=0;
function runFlicker(){
  const el=$('#topicText'); if(!el) return;
  const tok=++flickTok;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){Snd.reveal(); return;}
  const fin=el.textContent,lab=$('.eyebrow');
  if(lab) lab.style.visibility='hidden';
  /* cada quadro da animação toca um clique da roleta; o ritmo desacelera até revelar o tema */
  const delays=[55,55,60,65,75,90,110,135,170,215];
  let n=0;
  const step=()=>{
    if(tok!==flickTok) return;
    if(!document.body.contains(el)){Snd.cutFx(); return;}
    if(n>=delays.length){el.textContent=fin; if(lab) lab.style.visibility=''; Snd.reveal(); return;}
    el.textContent=TOPICOS[Math.floor(Math.random()*TOPICOS.length)].t;
    Snd.tick(n);
    setTimeout(step,delays[n++]);
  };
  step();
}
function render(){
  const view=currentView(),y=window.scrollY;
  app.innerHTML=header(view)+'<main id="main">'+V[view]()+'</main>';
  if(ui.top){window.scrollTo(0,0); ui.top=false;} else window.scrollTo(0,y);
  if(ui.focusId){const f=document.getElementById(ui.focusId); if(f) f.focus({preventScroll:true}); ui.focusId=null;}
  else if(ui.fk){
    const all=document.querySelectorAll('[data-act]');
    for(let i=0;i<all.length;i++){if(fkOf(all[i])===ui.fk){all[i].focus({preventScroll:true}); break;}}
  }
  ui.fk=null;
  if(ui.shuffle){ui.shuffle=false; runFlicker();}
  ui.anim=false;
  syncWake(); syncCountdown(); tick();
}

/* ============================================================
   Ações
   ============================================================ */
function handleAct(el){
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v,k=el.dataset.k;
  if(el.dataset.confirm){
    const key=a+':'+(id||'');
    if(ui.confirm!==key){ui.confirm=key; ui.fk=fkOf(el); render(); return;}
    ui.confirm=null;
  }else ui.confirm=null;
  ui.fk=fkOf(el);
  const c=S.ch;
  switch(a){
    case 'sortear': doSortear(); break;
    case 'salvar': if(c) toggleSaved(c.topic); break;
    case 'iniciarPesq': if(c){c.stage='pesquisa'; c.pesq.dur=S.prefs.pesq*60; save('ch'); ui.top=true; ui.anim=true;} break;
    case 'dur': {const t=curTimer(); if(t&&t.status==='idle'&&t.acc===0){t.dur=Number(v)*60; save('ch');} break;}
    case 'tstart': {const t=curTimer(); if(t&&(t.status==='idle'||t.status==='paused')){
      const inicio=t.status==='idle';
      Snd.unlock(); t.status='running'; t.t0=Date.now(); save('ch');
      if(inicio) Snd.start();   /* só no início: continuar não toca nada */
    } break;}
    case 'tpause': {const t=curTimer(); if(t&&t.status==='running'){Snd.cancelAll(); t.acc=elapsed(t); t.status='paused'; t.t0=0; save('ch');} break;}
    case 'trestart': {const t=curTimer(); if(t){Snd.cancelAll(); t.status='idle'; t.acc=0; t.t0=0; t.spent=0; save('ch');} break;}
    case 'tfinish': finishTimer(); break;
    case 'som': {
      S.prefs.som=!S.prefs.som; save('prefs');
      if(S.prefs.som){Snd.unlock(); Snd.confirm(); cdSig='';} else Snd.cancelAll();
      break;
    }
    case 'tema': if(['auto','claro','escuro'].indexOf(v)>=0){S.prefs.tema=v; save('prefs'); applyTheme();} break;
    case 'apoioToggle': {const has=c&&Object.keys(c.apoio||{}).some(x=>(c.apoio[x]||'').trim()); const cur=ui.apoioOpen==null?has:ui.apoioOpen; ui.apoioOpen=!cur; break;}
    case 'abandonar': Snd.cancelAll(); S.ch=null; ui.done=null; ui.apoioOpen=null; save('ch'); ui.top=true; break;
    case 'refl': if(c){c.refl=c.refl||{}; c.refl[k]=(c.refl[k]===v)?undefined:v; save('ch');} break;
    case 'concluir': if(c){
      const e={id:uid(),ts:Date.now(),topic:c.topic,pesquisaSeg:c.pesq.spent||0,explicacaoSeg:c.expl.spent||0,
        pesquisaPlan:c.pesq.dur,explicacaoPlan:c.expl.dur,apoio:c.apoio||{},refl:c.refl||{},aprendi:c.aprendi||'',quero:c.quero||''};
      S.history.unshift(e); save('history');
      ui.done={topic:c.topic,entryId:e.id}; S.ch=null; save('ch'); ui.apoioOpen=null; ui.top=true; ui.anim=true;
    } break;
    case 'notaDoTema': {
      const t=ui.done&&ui.done.topic; ui.done=null;
      ui.noteDraft={id:null,tipo:'anotacao',titulo:'',corpo:'',links:'',topic:t||null}; ui.noteErr=''; ui.top=true;
      location.hash='#caderno'; break;
    }
    case 'catToggle': ui.catOpen=!ui.catOpen; break;
    case 'catAll': S.prefs.excl=[]; save('prefs'); break;
    case 'catNone': S.prefs.excl=BANCO.map(x=>x.id); save('prefs'); break;
    case 'catOnly': S.prefs.excl=BANCO.map(x=>x.id).filter(x=>x!==id); save('prefs'); break;
    case 'histToggle': ui.histOpen=ui.histOpen===id?null:id; break;
    case 'histDel': S.history=S.history.filter(h=>h.id!==id); save('history'); ui.histOpen=null; break;
    case 'histRepeat': {const h=S.history.find(x=>x.id===id); if(h) startWith(h.topic); break;}
    case 'startSaved': {const s=S.saved.find(x=>x.id===id); if(s) startWith(s); break;}
    case 'delSaved': S.saved=S.saved.filter(s=>s.id!==id); save('saved'); break;
    case 'exportar': doExport(); return;
    case 'impPick': {const f=document.getElementById('imp-file'); if(f) f.click(); return;}
    case 'copiarExp': {
      const t=ui.expText;
      try{navigator.clipboard.writeText(t).then(()=>{ui.expMsg={ok:true,t:'Texto copiado.'}; render();}).catch(()=>{const x=document.getElementById('exp-text'); if(x){x.focus(); x.select();}});}
      catch(e){const x=document.getElementById('exp-text'); if(x){x.focus(); x.select();}}
      return;
    }
    case 'impTexto': {const t=(ui.impText||'').trim(); if(!t){ui.impMsg={ok:false,t:'Cole o conteúdo do arquivo antes de verificar.'}; break;} readImportText(t,''); break;}
    case 'impCancel': ui.imp=null; ui.impMsg=null; break;
    case 'impMerge': applyImport('merge'); break;
    case 'impReplace': applyImport('replace'); break;
    case 'ctNew': ui.ctDraft={id:null,t:'',cid:BANCO[0].id}; ui.ctErr=''; ui.focusId='ct-nome'; break;
    case 'ctEdit': {const c=S.custom.find(x=>x.id===id); if(c){ui.ctDraft={id:c.id,t:c.t,cid:c.cid}; ui.ctErr=''; ui.focusId='ct-nome';} break;}
    case 'ctCancel': ui.ctDraft=null; ui.ctErr=''; break;
    case 'ctSave': ctSave(); break;
    case 'ctDel': S.custom=S.custom.filter(x=>x.id!==id); S.saved=S.saved.filter(x=>x.id!==id); save('custom'); save('saved'); rebuildTopics(); if(ui.ctDraft&&ui.ctDraft.id===id) ui.ctDraft=null; break;
    case 'limparHist': S.history=[]; save('history'); ui.histOpen=null; ui.histFiltro=''; break;
    case 'noteNew': ui.noteDraft={id:null,tipo:'anotacao',titulo:'',corpo:'',links:'',topic:null}; ui.noteErr=''; ui.top=true; break;
    case 'noteEdit': {const n=S.notes.find(x=>x.id===id); if(n){ui.noteDraft=JSON.parse(JSON.stringify(n)); ui.noteErr=''; ui.top=true;} break;}
    case 'noteTipo': if(ui.noteDraft) ui.noteDraft.tipo=v; break;
    case 'noteCancel': ui.noteDraft=null; ui.noteErr=''; ui.top=true; break;
    case 'noteSave': {
      const d=ui.noteDraft; if(!d) break;
      if(!(d.titulo||'').trim()&&!(d.corpo||'').trim()&&!(d.links||'').trim()){ui.noteErr='Escreva um título, um texto ou um link antes de salvar.'; break;}
      const now=Date.now();
      if(d.id){const i=S.notes.findIndex(x=>x.id===d.id); if(i>=0) S.notes[i]=Object.assign({},d,{atualizada:now});}
      else S.notes.unshift(Object.assign({},d,{id:uid(),criada:now,atualizada:now}));
      save('notes'); ui.noteDraft=null; ui.noteErr=''; ui.top=true; break;
    }
    case 'noteDel': S.notes=S.notes.filter(n=>n.id!==id); save('notes'); break;
    case 'planNew': ui.planId='new'; ui.newPlan={tema:''}; ui.planErr=''; ui.top=true; break;
    case 'planSortear': {const t=TOPICOS[Math.floor(Math.random()*TOPICOS.length)]; ui.newPlan={tema:t.t}; break;}
    case 'planCreate': {
      const txt=((ui.newPlan&&ui.newPlan.tema)||'').trim();
      if(!txt){ui.planErr='Escolha um tema da lista ou escreva o seu.'; break;}
      const m=TOPICOS.find(t=>t.t.toLowerCase()===txt.toLowerCase());
      const topic=m?{id:m.id,t:m.t,c:m.c,cid:m.cid}:{id:'p-'+uid(),t:txt,c:'Tema próprio',cid:'proprio'};
      const p={id:uid(),criado:Date.now(),topic:topic,objetivo:'',sabia:'',etapas:[],descobertas:'',duvidas:'',reflexao:''};
      S.plans.unshift(p); save('plans'); ui.planId=p.id; ui.newPlan=null; ui.planErr=''; ui.top=true; break;
    }
    case 'planOpen': ui.planId=id; ui.top=true; break;
    case 'planBack': ui.planId=null; ui.newPlan=null; ui.planErr=''; ui.top=true; break;
    case 'planDel': S.plans=S.plans.filter(p=>p.id!==id); save('plans'); ui.planId=null; ui.top=true; break;
    case 'etapaAdd': addEtapa(); break;
    case 'etapaDel': {const p=curPlan(); if(p){p.etapas=p.etapas.filter(e=>e.id!==id); save('plans');} break;}
  }
  render();
}
function addEtapa(){
  const p=curPlan(),inp=document.getElementById('p-novaetapa');
  if(!p||!inp) return;
  const txt=inp.value.trim();
  if(!txt){ui.focusId='p-novaetapa'; return;}
  p.etapas.push({id:uid(),txt:txt,ok:false}); save('plans'); ui.focusId='p-novaetapa'; ui.fk=null;
}

/* ============================================================
   Eventos
   ============================================================ */
function bindObj(root){return root==='ch'?S.ch:root==='nd'?ui.noteDraft:root==='pl'?curPlan():root==='np'?ui.newPlan:root==='ct'?ui.ctDraft:root==='ix'?ui:null;}
function bind(el,path){
  const parts=path.split('.'),root=parts.shift();
  let o=bindObj(root); if(!o) return;
  while(parts.length>1){const k=parts.shift(); o[k]=o[k]||{}; o=o[k];}
  o[parts[0]]=el.value;
  if(root==='ch') save('ch'); else if(root==='pl') save('plans');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.tagName==='INPUT'||el.disabled) return;
  handleAct(el);
});
document.addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind;
  if(b) bind(e.target,b);
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act,c=el.dataset.change;
  if(a==='catCheck'){
    const id=el.dataset.id,i=S.prefs.excl.indexOf(id);
    if(el.checked){if(i>=0) S.prefs.excl.splice(i,1);} else if(i<0) S.prefs.excl.push(id);
    save('prefs'); ui.fk='catCheck|'+id+'|'; render();
  }else if(a==='etapaCheck'){
    const p=curPlan(),it=p&&p.etapas.find(x=>x.id===el.dataset.id);
    if(it){it.ok=el.checked; save('plans');}
    ui.fk='etapaCheck|'+el.dataset.id+'|'; render();
  }else if(c==='histFiltro'){ui.histFiltro=el.value; ui.focusId=el.id; render();}
  else if(c==='setPesq'){S.prefs.pesq=Number(el.value); save('prefs'); ui.focusId=el.id; render();}
  else if(c==='setExpl'){S.prefs.expl=Number(el.value); save('prefs'); ui.focusId=el.id; render();}
  else if(c==='ctCat'){if(ui.ctDraft) ui.ctDraft.cid=el.value;}
  else if(c==='impFile'){
    const f=el.files&&el.files[0]; if(!f) return;
    if(f.size>20*1024*1024){ui.impMsg={ok:false,t:'O arquivo é grande demais para ser uma exportação do Curiosa.'}; render(); return;}
    const r=new FileReader();
    r.onload=()=>{readImportText(String(r.result||''),f.name); render();};
    r.onerror=()=>{ui.impMsg={ok:false,t:'Não foi possível ler o arquivo.'}; render();};
    r.readAsText(f);
  }
  else if(c==='noteTema'){
    if(ui.noteDraft) ui.noteDraft.topic=el.value?(topicChoices().find(t=>t.id===el.value)||null):null;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='p-novaetapa'){e.preventDefault(); addEtapa(); render();}
  if(e.key==='Enter'&&e.target&&e.target.id==='ct-nome'){e.preventDefault(); ctSave(); render();}
});
window.addEventListener('hashchange',()=>{ui.confirm=null; ui.top=true; render();});
document.addEventListener('visibilitychange',()=>{tick(); syncWake();});
setInterval(tick,250);

render();
})();
</script>

</body></html>
